<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Philips N4520 Player</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="viewer" aria-label="Philips N4520 reel to reel visualization">
        <div class="deck-photo-stage" id="deck" data-mode="stop">
          <img class="deck-photo" src="assets/n4520-reference.jpg" alt="Philips N4520 reel to reel deck">
          <div class="photo-vignette" aria-hidden="true"></div>
          <canvas class="reel-3d-layer" id="reelCanvas" aria-hidden="true"></canvas>

          <div class="reel-mount reel-mount-left">
            <div class="photo-reel" id="leftReel">
              <div class="tape-pack photo-pack" id="leftPack"></div>
              <span class="reel-slot slot-a"></span>
              <span class="reel-slot slot-b"></span>
              <span class="reel-slot slot-c"></span>
              <span class="reel-brand">PHILIPS</span>
              <span class="reel-screw screw-a"></span>
              <span class="reel-screw screw-b"></span>
              <span class="reel-screw screw-c"></span>
              <span class="reel-hub"></span>
              <span class="nab-lock"></span>
            </div>
          </div>

          <div class="reel-mount reel-mount-right">
            <div class="photo-reel" id="rightReel">
              <div class="tape-pack photo-pack" id="rightPack"></div>
              <span class="reel-slot slot-a"></span>
              <span class="reel-slot slot-b"></span>
              <span class="reel-slot slot-c"></span>
              <span class="reel-brand">PHILIPS</span>
              <span class="reel-screw screw-a"></span>
              <span class="reel-screw screw-b"></span>
              <span class="reel-screw screw-c"></span>
              <span class="reel-hub"></span>
              <span class="nab-lock"></span>
            </div>
          </div>

          <svg class="photo-tape-path" viewBox="0 0 1600 1200" preserveAspectRatio="none" aria-hidden="true">
            <path class="tape-shadow" id="tapeShadow" d="M 501 612 C 464 650 438 704 410 760 C 463 743 520 721 588 699 C 666 673 737 675 804 688 C 892 706 970 685 1048 714 C 1104 735 1162 752 1192 708 C 1166 663 1134 632 1096 611"></path>
            <path class="tape-line" id="movingTape" d="M 501 612 C 464 650 438 704 410 760 C 463 743 520 721 588 699 C 666 673 737 675 804 688 C 892 706 970 685 1048 714 C 1104 735 1162 752 1192 708 C 1166 663 1134 632 1096 611"></path>
          </svg>

          <div class="roller-rest-cover" aria-hidden="true"></div>
          <div class="capstan" id="capstan" aria-hidden="true"></div>
          <div class="pinch-roller" aria-hidden="true"></div>

          <img class="vu-photo vu-photo-left" src="assets/vu-left-blank.png" alt="">
          <img class="vu-photo vu-photo-right" src="assets/vu-right-blank.png" alt="">
          <img class="vu-frame vu-frame-left" src="assets/vu-left-frame.png" alt="">
          <img class="vu-frame vu-frame-right" src="assets/vu-right-frame.png" alt="">

          <div class="meter-overlay meter-left" aria-hidden="true">
            <span class="needle" id="needleL"></span>
            <span class="led led3" id="ledL3">+3</span>
            <span class="led led6" id="ledL6">+6</span>
          </div>
          <div class="meter-overlay meter-right" aria-hidden="true">
            <span class="needle" id="needleR"></span>
            <span class="led led3" id="ledR3">+3</span>
            <span class="led led6" id="ledR6">+6</span>
          </div>

          <button class="hotspot transport-hotspot rewind" id="rewindButton" aria-label="rewind"></button>
          <button class="hotspot transport-hotspot stop" id="stopButton" aria-label="stop"></button>
          <button class="hotspot transport-hotspot play" id="playButton" aria-label="play"></button>
          <button class="hotspot transport-hotspot pause" id="pauseButton" aria-label="pause"></button>
          <button class="hotspot transport-hotspot ff" id="ffButton" aria-label="fast forward"></button>
          <button class="hotspot transport-hotspot rec" id="recButton" aria-label="record arm"></button>

          <div class="counter-overlay" id="counter">00:00.0</div>

          <div class="deck-controls">
            <label class="file-picker">
              <input id="fileInput" type="file" accept="audio/mpeg,audio/mp3,audio/flac,.mp3,.flac">
              <span>Load MP3 / FLAC</span>
            </label>
            <div class="track-readout" id="trackName">No file loaded</div>
            <div class="speed-panel" aria-label="tape speed">
              <button class="speed active" data-speed="15">15</button>
              <button class="speed" data-speed="7.5">7 1/2</button>
              <button class="speed" data-speed="3.75">3 3/4</button>
            </div>
            <button class="utility" id="zeroButton">zero</button>
            <button class="utility" id="cueButton">cue</button>
          </div>

          <audio id="audio" preload="metadata"></audio>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
